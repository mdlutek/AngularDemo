name: Deploy Angular Frontend to FTP

on:
  push:
    branches:
      - main
    paths:
      - 'src/Frontend/**' # Uruchamia się tylko, gdy zmieniasz coś we frontendzie
  workflow_dispatch:      # Pozwala też uruchomić deploy ręcznie jednym kliknięciem

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: 🟢 Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'src/Frontend/library-ui/package-lock.json'

      - name: 📦 Zainstaluj zależności npm
        run: |
          cd src/Frontend/library-ui
          npm ci

      - name: 🏗️ Zbuduj projekt Angular
        run: |
          cd src/Frontend/library-ui
          npx ng build --configuration production

      - name: 📄 Dodaj plik .htaccess dla routingu SPA
        run: |
          cat << 'EOF' > src/Frontend/library-ui/dist/library-ui/browser/.htaccess
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: 🚀 Wgraj pliki na TheCamels (IPv4)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "
            set dns:order inet;
            set ftp:prefer-epsv false;
            set ftp:passive-mode true;
            set ftp:ssl-allow no;
            open -u ${{ secrets.FTP_USERNAME }},'${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
            mirror --reverse --verbose src/Frontend/library-ui/dist/library-ui/browser/ public_html/;
            quit
          "
